name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install pinned dependencies (matplotlib, numpy, pytest)"
        run: python -m pip install -r requirements.txt

      - name: "Run tests: offline, includes a full run of the study compared with the committed results"
        run: python -m pytest
